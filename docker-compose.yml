services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: coding_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d coding_agent"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/coding_agent
      AGENT_WORKSPACE: /app/workspace
      # Inside the container the agent can only touch the mounted workspace,
      # so allowing shell commands is reasonably contained here.
      AGENT_AUTO_APPROVE: "true"
    volumes:
      - ./workspace:/app/workspace
      - ./logs:/app/logs

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      AGENT_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
